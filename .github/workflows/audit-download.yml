name: Publish validated signed APK test download
on:
  push:
    branches: ['fix/run158-audit-remediation']
    paths: ['.github/workflows/audit-download.yml']
permissions:
  contents: write
  actions: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36952515546
          name: signed-candidate-36952515546
          path: validated
      - name: Verify exact signed candidate
        run: |
          set -euo pipefail
          cd validated
          sha256sum -c candidate/SHA256SUMS
          grep -q 'commit=af185b53529d311ebd9fde5b7a60b7244e9a0701' candidate/PROVENANCE.txt
          cp candidate/Miqaat.apk ../Miqaat-1.84-audit.apk
          cd ..
          sha256sum Miqaat-1.84-audit.apk > Miqaat-1.84-audit.apk.sha256
      - name: Attach exact APK to existing testing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload audit-fixes-3895c823 Miqaat-1.84-audit.apk Miqaat-1.84-audit.apk.sha256 --repo haawas-alt/miqaat --clobber
