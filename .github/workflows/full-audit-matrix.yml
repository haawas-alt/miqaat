name: Full app audit matrix (phone and tablet, emulators)
on:
  workflow_dispatch:
  push:
    branches: ['feat/gallery-tablet-landscape-option3']
    paths: ['.github/workflows/full-audit-matrix.yml']
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Rotation 0 is the natural orientation: portrait for phones, landscape for tablets. Rotation 1 flips it.
        device:
          - { name: phone-portrait, profile: pixel_6, rotation: 0, api: 35 }
          - { name: phone-landscape, profile: pixel_6, rotation: 1, api: 35 }
          - { name: tablet-landscape, profile: pixel_tablet, rotation: 0, api: 35 }
          - { name: tablet-portrait, profile: pixel_tablet, rotation: 1, api: 35 }
        # a: homes (4 themes x 100/130/200 %, EN and UR) and states; b: settings; c: secondary pages; d: Azaan flow and Learn.
        group:
          - { id: a, tests: 'homes,homesUrdu,states' }
          - { id: b, tests: 'settingsLanding,settingsCategories' }
          - { id: c, tests: 'secondaryPages' }
          - { id: d, tests: 'azaanFlow,learnLessons' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator matrix group
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_PAGE_SIZE: '4096'
          REGRESSION_CLASSES: 'HomeLargeTextTest AdhkarEntryTest'
          # Report the real release identity in About, not the debug default.
          MIQAAT_VERSION_NAME: '1.163-gallery'
          MIQAAT_VERSION_CODE: '1792276064'
        with:
          api-level: ${{ matrix.device.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/emulator-run.sh ${{ matrix.device.rotation }} ${{ matrix.device.name }}-${{ matrix.group.id }} "${{ matrix.group.tests }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.device.name }}-${{ matrix.group.id }}-${{ github.run_id }}
          path: |
            shots/
            app/build/outputs/androidTest-results/**/*.xml
            app/build/test-results/**/*.xml
          if-no-files-found: warn
  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-*-${{ github.run_id }}
          path: downloaded
      - name: Collect screenshots and results
        run: |
          OUT=publish; rm -rf "$OUT"; mkdir -p "$OUT"
          find downloaded -type f -name "*.png" > pngs.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#downloaded/}"; dir="${rel%%/*}"
            mkdir -p "$OUT/$dir"; cp "$f" "$OUT/$dir/$(basename "$f")" || true
          done < pngs.txt
          find downloaded -type f -name "*.xml" > xmls.txt || true
          SUM="$OUT/SUMMARY.md"
          { echo "# Full audit matrix run ${{ github.run_number }} (${{ github.sha }})"; echo; } > "$SUM"
          while IFS= read -r x; do
            [ -n "$x" ] || continue
            dir="$(echo "${x#downloaded/}" | cut -d/ -f1)"
            mkdir -p "$OUT/$dir/results"; cp "$x" "$OUT/$dir/results/$(basename "$x")" || true
            head -c 300 "$x" | grep -o '<testsuite [^>]*' | head -1 | sed "s#^#- $dir: #" >> "$SUM" || true
            grep -h -A1 '<failure' "$x" | head -20 | sed "s#^#    FAIL $dir: #" >> "$SUM" || true
          done < xmls.txt
          echo "PNG files: $(wc -l < pngs.txt)  XML files: $(wc -l < xmls.txt)" | tee -a "$SUM"
          exit 0
      - name: Publish to ci-audit-full branch
        env:
          GITHUB_WORKSPACE_REMOTE: ${{ format('https://x-access-token:{0}@github.com/{1}.git', secrets.GITHUB_TOKEN, github.repository) }}
        run: |
          set -uo pipefail
          D="$(mktemp -d)"; cp -r publish/. "$D"/; cd "$D"
          git init -q && git checkout -q -b ci-audit-full
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "full audit matrix ${{ github.run_number }}" || true
          git push -qf "$GITHUB_WORKSPACE_REMOTE" HEAD:ci-audit-full
