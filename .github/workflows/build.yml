name: Build

on:
  push:
    branches: [main, stable, four-themes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is not set"; exit 1; fi
          mkdir -p keystore && echo "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks

      # Gates, in order: unit tests → lint (accessibility + correctness errors fail the build) →
      # release builds for both editions (github APK with updater, play AAB + APK without).
      - name: Test, lint and build both editions
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testGithubReleaseUnitTest lintGithubRelease assembleGithubRelease assemblePlayRelease bundlePlayRelease 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          grep -E "^e: |error:|Error:|FAILURE|What went wrong|Caused by|FAILED|expected|Assertion|Lint found" build.log | sed 's#file:///home/runner/work/miqaat/miqaat/##' | head -200 > errors.txt || true
          find app/build/reports -name "lint-results*.txt" -exec cat {} \; >> errors.txt 2>/dev/null || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . || true
          mkdir -p /tmp/keep && cp errors.txt build.log /tmp/keep/
          git clean -fdxq || true
          cp /tmp/keep/* .
          git add errors.txt build.log
          git commit -qm "build log ${{ github.run_number }}" || true
          git push -f origin ci-logs

      - name: Rejected legacy artwork must be absent from source and from every shipped package
        run: python3 tools/check_forbidden_assets.py app/src/main app/build/outputs/apk/github/release/app-github-release.apk app/build/outputs/apk/play/release/app-play-release.apk app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Collect outputs and checksums
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk Miqaat.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk Miqaat-play.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab Miqaat-play.aab
          sha256sum Miqaat.apk | cut -d' ' -f1 > Miqaat.apk.sha256
          sha256sum Miqaat-play.apk | cut -d' ' -f1 > Miqaat-play.apk.sha256
          sha256sum Miqaat-play.aab | cut -d' ' -f1 > Miqaat-play.aab.sha256
          echo "SHA=$(cat Miqaat.apk.sha256)" >> $GITHUB_ENV
          echo "SHA_PLAY=$(cat Miqaat-play.aab.sha256)" >> $GITHUB_ENV
          ls -la Miqaat*
          { echo "NOTES<<EOF"; git log -5 --pretty=format:'- %s'; echo; echo "EOF"; } >> $GITHUB_ENV
          mkdir -p reports && cp -r app/build/reports/lint-results* reports/ 2>/dev/null || true
          cp -r app/build/test-results reports/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Miqaat-build-${{ github.run_number }}
          path: |
            Miqaat.apk
            Miqaat.apk.sha256
            Miqaat-play.apk
            Miqaat-play.aab
            Miqaat-play.aab.sha256
            reports/

      # Branch previews (four-themes): a pre-release under its own tag so the APK can be installed for testing.
      # The in-app updater only reads the `latest` tag, so this never reaches anyone's updater.
      - name: Publish branch preview APK (four-themes only)
        if: github.ref == 'refs/heads/four-themes'
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git tag -f four-themes-preview "${{ github.sha }}"
          git push -f origin four-themes-preview
      - name: Branch preview release
        if: github.ref == 'refs/heads/four-themes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: four-themes-preview
          name: Four-themes preview (build ${{ github.run_number }})
          body: |
            Preview of the four-theme work. build=${{ github.run_number }} commit=${{ github.sha }}
            Not a release: the in-app updater ignores this tag.
          files: |
            Miqaat.apk
            Miqaat.apk.sha256
          prerelease: true
          make_latest: false

      # Immutable provenance: an annotated tag per build, at the exact commit that was built.
      - name: Tag this build (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git tag -a "v1.${{ github.run_number }}" -m "Miqaat build ${{ github.run_number }} · sha256 ${{ env.SHA }}" "${{ github.sha }}"
          git push origin "v1.${{ github.run_number }}"
          # 'latest' is a moving pointer for the in-app updater; keep it on the commit that was actually built.
          git tag -f latest "${{ github.sha }}"
          git push -f origin latest

      - name: Permanent release for this build (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Miqaat 1.${{ github.run_number }}
          body: |
            build=${{ github.run_number }}
            commit=${{ github.sha }}

            **Direct-download edition** — `Miqaat.apk` (in-app updater, verifies this SHA-256 before installing): `${{ env.SHA }}`
            **Google Play edition** — `Miqaat-play.aab` for the Play Console: `${{ env.SHA_PLAY }}`

            **Recent changes**
            ${{ env.NOTES }}

            Built by GitHub Actions from the commit above · content register in ISLAMIC_REVIEW_PACK.md · remediation log in AUDIT_REMEDIATION.md
          files: |
            Miqaat.apk
            Miqaat.apk.sha256
            Miqaat-play.apk
            Miqaat-play.apk.sha256
            Miqaat-play.aab
            Miqaat-play.aab.sha256
          prerelease: false

      - name: Update the 'latest' pointer release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Miqaat (latest build)
          body: |
            build=${{ github.run_number }}
            commit=${{ github.sha }}

            Pointer to the newest build, used by the in-app updater. The permanent copy of this exact build is release `v1.${{ github.run_number }}`.

            SHA-256 `${{ env.SHA }}` · built from `${{ github.sha }}` by GitHub Actions
          files: |
            Miqaat.apk
            Miqaat.apk.sha256
          prerelease: false

      - name: Publish the stable backup (stable branch only)
        if: github.ref == 'refs/heads/stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: Miqaat (stable backup)
          body: |
            Backup of the stable branch. Install this if a newer build misbehaves.
            commit=${{ github.sha }} · SHA-256 `${{ env.SHA }}`
          files: |
            Miqaat.apk
            Miqaat.apk.sha256
          prerelease: false

  # Screenshots and UI regression tests on a real Android emulator (tablet and phone, both orientations), for the branch
  # under review. Never blocks the APK. Each profile uploads its PNGs; the publish job pushes them to ci-screenshots.
  emulator:
    if: github.ref == 'refs/heads/four-themes'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A tablet's natural orientation is landscape, a phone's is portrait; rotation 1 flips either. Each device is split
        # into three groups of tests so the matrix finishes inside the time box.
        include:
          - { name: tablet-landscape, group: a, profile: pixel_tablet, rotation: 0, tests: 'homes,homesUrdu,states' }
          - { name: tablet-landscape, group: b, profile: pixel_tablet, rotation: 0, tests: 'settingsLanding,settingsCategories' }
          - { name: tablet-landscape, group: c, profile: pixel_tablet, rotation: 0, tests: 'secondaryPages' }
          - { name: tablet-portrait, group: a, profile: pixel_tablet, rotation: 1, tests: 'homes,homesUrdu,states' }
          - { name: tablet-portrait, group: b, profile: pixel_tablet, rotation: 1, tests: 'settingsLanding,settingsCategories' }
          - { name: tablet-portrait, group: c, profile: pixel_tablet, rotation: 1, tests: 'secondaryPages' }
          - { name: phone-portrait, group: a, profile: pixel_6, rotation: 0, tests: 'homes,homesUrdu,states' }
          - { name: phone-portrait, group: b, profile: pixel_6, rotation: 0, tests: 'settingsLanding,settingsCategories' }
          - { name: phone-portrait, group: c, profile: pixel_6, rotation: 0, tests: 'secondaryPages' }
          - { name: phone-landscape, group: a, profile: pixel_6, rotation: 1, tests: 'homes,homesUrdu,states' }
          - { name: phone-landscape, group: b, profile: pixel_6, rotation: 1, tests: 'settingsLanding,settingsCategories' }
          - { name: phone-landscape, group: c, profile: pixel_6, rotation: 1, tests: 'secondaryPages' }
          - { name: tablet-landscape, group: d, profile: pixel_tablet, rotation: 0, tests: 'azaanFlow' }
          - { name: tablet-portrait, group: d, profile: pixel_tablet, rotation: 1, tests: 'azaanFlow' }
          - { name: phone-portrait, group: d, profile: pixel_6, rotation: 0, tests: 'azaanFlow' }
          - { name: phone-landscape, group: d, profile: pixel_6, rotation: 1, tests: 'azaanFlow' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: mkdir -p keystore && echo "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run emulator tests and collect screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/emulator-run.sh ${{ matrix.rotation }} ${{ matrix.name }}-${{ matrix.group }} ${{ matrix.tests }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.name }}-${{ matrix.group }}
          path: shots/
          if-no-files-found: ignore

  publish-screens:
    needs: emulator
    if: always() && github.ref == 'refs/heads/four-themes'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: /tmp/shots
      - name: Publish to ci-screenshots
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + || true
          mkdir -p shots && cp -r /tmp/shots/. shots/
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > shots/RUN.txt
          git add -A shots
          git commit -qm "screenshots ${{ github.run_number }} (${{ github.sha }})" || true
          git push -f origin ci-screenshots
