name: Publish checked signed APK test download
on:
  push:
    branches: ['fix/run158-audit-remediation']
    paths: ['.github/workflows/audit-download.yml']
permissions:
  contents: write
  actions: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation for the exact candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          source = "3903c60b5ffcab8645fcb176282c962cfda71bc6"
          for run in (37101494556, 37101494544):
              data = json.loads(subprocess.check_output(["gh", "api", f"repos/haawas-alt/miqaat/actions/runs/{run}"]))
              assert data["head_sha"] == source and data["conclusion"] == "success", f"Validation gate not met: {run}"
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37101494556
          name: signed-candidate-37101494556
          path: validated
      - name: Verify exact signed candidate and layout/counter regressions
        run: |
          set -euo pipefail
          cd validated
          sha256sum -c candidate/SHA256SUMS
          grep -q 'commit=3903c60b5ffcab8645fcb176282c962cfda71bc6' candidate/PROVENANCE.txt
          grep -q '6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01' candidate/github-signature.txt
          echo 'e35f0c3bd02c81766e4b5433da3e26b5ebe25e7d07817f02122c5817f0d90bfa  candidate/Miqaat.apk' | sha256sum -c -
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, json
          files = list(pathlib.Path(".").rglob("TEST-com.usman.miqaat.ui.SettingsBackAcceptanceTest.xml"))
          assert files, "Missing corrected Settings regression evidence"
          for path in files:
              root = ET.parse(path).getroot()
              assert root.get("tests") == "2"
              assert all(root.get(k, "0") == "0" for k in ("failures", "errors", "skipped"))
          for suite, count in (("ApprovedSalahRebuildTest", "3"), ("DailyDhikrProgressTest", "3")):
              suites = [p for p in pathlib.Path(".").rglob("TEST-*.xml") if p.name.endswith("." + suite + ".xml")]
              assert suites, f"Missing {suite} evidence"
              for path in suites:
                  root = ET.parse(path).getroot()
                  assert root.get("tests") == count
                  assert all(root.get(k, "0") == "0" for k in ("failures", "errors", "skipped"))
          reports = json.loads(pathlib.Path("candidate/native-page-alignment.json").read_text())
          assert len(reports) == 2 and all(r["result"] == "PASS" for r in reports)
          PY
          cp candidate/Miqaat.apk ../Miqaat-1.85-salah.apk
          cp candidate/Miqaat-play.aab ../Miqaat-1.85-salah-play.aab
          cp candidate/PROVENANCE.txt ../Miqaat-1.85-salah-PROVENANCE.txt
          cd ..
          sha256sum Miqaat-1.85-salah.apk > Miqaat-1.85-salah.apk.sha256
          sha256sum Miqaat-1.85-salah-play.aab > Miqaat-1.85-salah-play.aab.sha256
          cat >> Miqaat-1.85-salah-PROVENANCE.txt <<'TXT'
          Native runtime: source68ef915cf155f5bde7c4a2f82f107d107a292ff1; run36982213209; two native tests pass on API33/4KB and API35/16KB. Overall run failed other assertions.
          Raw phone evidence: sourceb4737afab4b928a3509e79a635e5e5fbb1cb8232; run36984122910; all216 captures pass strict inventory; overall run failed a case-sensitive Settings heading assertion.
          That assertion is corrected and the complete back/scroll contract passes both native JVM phone layouts; final Android assertion correction was compiled, not rerun.
          Fresh Salah vectors and lesson layout: source3903c60b5ffcab8645fcb176282c962cfda71bc6; audit37101494544 and signed37101494556. Native JVM rendered evidence; no fresh physical-device or emulator acceptance claimed.
          Approved mockup identity, qualified Urdu/Islamic approval, physical accessibility/OEM acceptance and Play Console approval remain pending.
          This existing testing release tag predates the candidate source; use this provenance and asset hashes, not the tag commit, to identify the build.
          TXT
      - name: Attach exact artifacts to existing testing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload audit-fixes-3895c823 Miqaat-1.85-salah.apk Miqaat-1.85-salah.apk.sha256 Miqaat-1.85-salah-play.aab Miqaat-1.85-salah-play.aab.sha256 Miqaat-1.85-salah-PROVENANCE.txt --repo haawas-alt/miqaat --clobber
