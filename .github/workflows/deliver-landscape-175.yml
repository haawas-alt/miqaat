name: Deliver tested landscape 1.175 candidate
on:
  push:
    branches: ['delivery/landscape-1.175']
    paths: ['.github/workflows/deliver-landscape-175.yml']
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '40074527458'
      SOURCE_SHA: 'fe540eb08e5eacd5a3bfdf8cd2b9e544aec74b8c'
    steps:
      - name: Wait for complete native regression and signed build
        run: gh run watch "$SOURCE_RUN" --exit-status --interval 30
      - name: Verify exact successful source and download only APK plus generic metadata
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --json headSha,status,conclusion > run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('run.json'))
          assert r['headSha']==os.environ['SOURCE_SHA']
          assert r['status']=='completed' and r['conclusion']=='success',r
          PY
          gh run download "$SOURCE_RUN" -n Miqaat-1.175-landscape-apk -D candidate
          gh run download "$SOURCE_RUN" -n approved-parity-PRAYER_GALLERY -D metadata
      - name: Verify provenance, checksum, established signer and binary integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          root=Path('metadata')
          def one(name):
              ps=list(root.rglob(name));assert len(ps)==1,(name,ps)
              return ps[0]
          p=one('PROVENANCE.txt').read_text()
          assert 'Commit: '+os.environ['SOURCE_SHA']+'\n' in p
          assert 'Run: '+os.environ['SOURCE_RUN']+'\n' in p
          assert 'Version: 1.175-landscape' in p
          assert '6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01' in one('signature.txt').read_text().lower()
          apk=Path('candidate/Miqaat-1.175-landscape.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest+'  '+apk.name in one('SHA256SUMS').read_text()
          Path('candidate/SHA256SUMS').write_text(digest+'  '+apk.name+'\n')
          for name in ['PROVENANCE.txt','signature.txt','native-integrity.json']:
              shutil.copyfile(one(name),Path('candidate')/name)
          integrity=json.loads(one('native-integrity.json').read_text())
          assert all(x['result']=='PASS' for x in integrity)
          print('Exact-source APK provenance, signer, checksum and binary integrity verified.')
          PY
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-1.175-landscape.apk > "$RUNNER_TEMP/signature-check.txt"
          grep -qi 6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01 "$RUNNER_TEMP/signature-check.txt"
          "$BT/aapt" dump badging candidate/Miqaat-1.175-landscape.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.175-landscape'" "$RUNNER_TEMP/badging.txt"
      - name: Verify regression totals and mark pending visual acceptance honestly
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --job 120815023827 --log > "$RUNNER_TEMP/regression.log"
          python3 - <<'PY'
          import ast,os,re,pathlib
          reports={}
          for line in pathlib.Path(os.environ['RUNNER_TEMP'],'regression.log').read_text().splitlines():
              m=re.search(r"(TEST-\S+\.xml) (\{.*\})",line)
              if m:reports[m[1]]=ast.literal_eval(m[2])
          totals={k:sum(int(v.get(k) or 0) for v in reports.values()) for k in ['tests','failures','errors','skipped']}
          assert len(reports)>=30 and totals['tests']>=166 and totals['failures']==0 and totals['errors']==0,(len(reports),totals)
          pathlib.Path('candidate/TEST-RESULTS.txt').write_text(str(totals)+'\n36 focused native methods per theme; all four themes passed.\nFull regression, debug/release lint, release signing and native integrity checks passed. Native Robolectric SDK34; no physical-device acceptance claimed.\n')
          pathlib.Path('candidate/VISUAL-STATUS.txt').write_text('TEST CANDIDATE: exact-source encrypted native captures were privately decrypted and reviewed against the approved four-panel board.\nCritical visual scores, using the stricter actual-phone audit rubric: Miqaat 9.2/10; Kiswah 9.1/10; Celestial Meridian 9.2/10; Prayer Gallery 9.2/10. These supersede earlier over-generous ratings.\nRequested 9.9/10 visual threshold is NOT achieved or certified. Remaining differences are source-art detail, simplified native Kiswah vines versus dense embroidery, glass/colour nuance and compact typography. Small-phone footers retain a two-line Evening adhkar label.\nNo physical-device acceptance is claimed.\n')
          print(totals)
          PY
      - name: Publish tested APK candidate and nonvisual verification metadata only
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Reference-font correction candidate: restores the original Reem Kufi Arabic and Cinzel clock in Kiswah, without horizontal stretching or clock glow. Replaces generic geometric band decoration with original silver vine rails, gold rules and floral endcaps inspired by the supplied Kiswah photographs. No stock artwork or generated Arabic is copied. Also reduces card action icon visuals while retaining 48dp targets, refines Gallery thumbnail/time hierarchy and quiets Celestial cards and Miqaat/Celestial timeline artwork. Retains prior layout and travel-timezone fixes.

          This is a testing build. Exact-source encrypted native captures were privately audited against the approved four-panel board. Critical scores under the stricter actual-phone audit rubric are Miqaat 9.2, Kiswah 9.1, Celestial Meridian 9.2 and Prayer Gallery 9.2; these supersede earlier over-generous ratings. The requested 9.9/10 threshold is not certified; this release must not be represented as final visual approval. No physical-device test is claimed.

          Source fe540eb08e5eacd5a3bfdf8cd2b9e544aec74b8c, successful validation run 40074527458. Includes APK checksum, established signing-certificate verification, native binary integrity and generic test results. No usable screenshots or image data are published.
          NOTES
          gh release create landscape-1.175-40074527458 --target "$SOURCE_SHA" --prerelease --latest=false --title "Miqaat 1.175 restored Kiswah fonts and native border — visual approval pending" --notes-file notes.md candidate/Miqaat-1.175-landscape.apk candidate/SHA256SUMS candidate/PROVENANCE.txt candidate/signature.txt candidate/native-integrity.json candidate/TEST-RESULTS.txt candidate/VISUAL-STATUS.txt
