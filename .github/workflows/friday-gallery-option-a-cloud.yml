name: Friday Gallery Option A cloud check

on:
  push:
    branches: ['recovery/friday-gallery-option-a-20261117']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and capture Option A contract views
        run: ./gradlew --no-daemon testGithubDebugUnitTest --tests 'com.usman.miqaat.ui.PrayerGalleryOptionACloudTest.*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-a-unit-results-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/option-a-review/
          if-no-files-found: warn
      - name: Print failed assertions
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().findall('testcase'):
                  for failure in case.findall('failure'):
                      print(f'{case.attrib.get("name")}: {failure.attrib.get("message")}')
          PY
      - name: Publish native review captures
        if: always()
        run: |
          if [ ! -d app/build/option-a-review ]; then exit 0; fi
          mkdir -p /tmp/option-a-shots
          cp -r app/build/option-a-review/. /tmp/option-a-shots/
          cd /tmp/option-a-shots
          git init -q
          git checkout -q -b "ci-option-a-shots-${GITHUB_SHA:0:12}"
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "Option A captures ${GITHUB_SHA:0:12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
