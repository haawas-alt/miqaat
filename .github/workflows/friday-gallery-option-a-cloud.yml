name: Friday Gallery Option A cloud check

on:
  push:
    branches: ['recovery/friday-gallery-option-a-20261117']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run unit tests
        run: ./gradlew --no-daemon testGithubDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-a-unit-results-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
