name: CA2 native preview
on:
  push:
    branches: ['feat/friday-option2', 'recovery/jumuah-one-day-20261108']
    paths:
      - '.github/workflows/ca2-native-preview.yml'
      - 'app/src/main/java/com/usman/miqaat/ui/WorshipApproved.kt'
      - 'app/src/main/java/com/usman/miqaat/ui/FridayLayoutMetrics.kt'
      - 'app/src/main/java/com/usman/miqaat/ui/FridayOption2.kt'
      - 'app/src/main/java/com/usman/miqaat/ui/CelestialFridayComponents.kt'
      - 'app/src/main/res/drawable/ca2_banner_*.xml'
      - 'app/src/test/java/com/usman/miqaat/ui/FridayQuietApprovedTest.kt'
  workflow_dispatch:
concurrency:
  group: ca2-native-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ca2-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: CA2 native normal and 115 percent matrix - all layouts languages and clocks
        run: ./gradlew --no-daemon testGithubReleaseUnitTest --tests 'com.usman.miqaat.ui.FridayQuietApprovedTest.celestialKeeps32ProfilesReadable' --tests 'com.usman.miqaat.ui.FridayQuietApprovedTest.celestialCountdownUsesLiveTickWithoutReplacingFacts'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca2-native-preview-${{ github.run_id }}
          path: app/build/friday-quiet-review/CELESTIAL_MERIDIAN/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca2-preview-reports-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: error
