name: Publish validated signed APK test download
on:
  push:
    branches: ['fix/run158-audit-remediation']
    paths: ['.github/workflows/audit-download.yml']
permissions:
  contents: write
  actions: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36952515546
          name: signed-candidate-36952515546
          path: validated
      - name: Verify exact signed candidate
        run: |
          set -euo pipefail
          cd validated
          sha256sum -c candidate/SHA256SUMS
          grep -q 'commit=af185b53529d311ebd9fde5b7a60b7244e9a0701' candidate/PROVENANCE.txt
          cp candidate/Miqaat.apk ../Miqaat-1.84-audit.apk
          cd ..
          sha256sum Miqaat-1.84-audit.apk > Miqaat-1.84-audit.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: audit-fixes-3895c823
          target_commitish: 3895c823d2b5f3f33bb51c9bafd55046ec208c09
          name: Miqaat 1.84-audit — signed testing candidate
          prerelease: true
          make_latest: false
          body: |
            The existing testing tag points to the earlier debug source; the signed APK asset is independently sourced from commit af185b53529d311ebd9fde5b7a60b7244e9a0701, validated run 36952515546.
            Includes updater package/version/signature checks and audit fixes. Export settings before uninstalling an older debug build: debug-to-release switching requires uninstall and clears local data.
            Testing only. Two Android acceptance jobs failed; content review, approved mockup comparison, physical accessibility and Play checks remain open. Production/latest is unchanged.
          files: |
            Miqaat-1.84-audit.apk
            Miqaat-1.84-audit.apk.sha256
