name: Android phone residual regression
on:
  push:
    branches: ['fix/run158-audit-remediation']
    paths: ['.github/workflows/phone-residual.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A tablet's natural orientation is landscape, a phone's is portrait; rotation 1 flips either. Each device is split
        # into four groups of tests so the matrix finishes inside the time box.
        include:
          - { name: phone-portrait, profile: pixel_6, rotation: 0, api: 33, target: google_apis, page_size: 4096 }
          - { name: phone-landscape, profile: pixel_6, rotation: 1, api: 35, target: google_apis_ps16k, page_size: 16384 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Essential targeted rerun: prior phone assertions failed; native replacement needs pre-34 and 16 KB runtime proof.
      - name: Phone regression and native compatibility evidence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
          REGRESSION_CLASSES: SettingsStateTest HomeLargeTextTest AdhkarEntryTest NativeGraphicsRuntimeTest
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            status=0
            bash .github/emulator-run.sh ${{ matrix.rotation }} ${{ matrix.name }}-a homes,homesUrdu,states || status=1
            bash .github/emulator-run.sh ${{ matrix.rotation }} ${{ matrix.name }}-d azaanFlow,learnLessons || status=1
            exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-residual-${{ matrix.name }}-${{ github.run_id }}
          path: shots/
          if-no-files-found: error
