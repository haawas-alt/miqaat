name: Cloud acceptance and signed candidate
on:
  push:
    branches: ['fix/run158-audit-remediation']
    paths: ['.github/workflows/cloud-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks
      - name: Build and inspect signed testing candidate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testGithubReleaseUnitTest lintGithubRelease assembleGithubRelease assemblePlayRelease bundlePlayRelease
          python3 tools/check_forbidden_assets.py app/src/main app/build/outputs/apk/github/release/app-github-release.apk app/build/outputs/apk/play/release/app-play-release.apk app/build/outputs/bundle/playRelease/app-play-release.aab
          mkdir -p candidate
          cp app/build/outputs/apk/github/release/app-github-release.apk candidate/Miqaat.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk candidate/Miqaat-play.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab candidate/Miqaat-play.aab
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-play.apk > candidate/play-signature.txt
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat.apk > candidate/github-signature.txt
          "$BT/aapt" dump badging candidate/Miqaat-play.apk > candidate/play-badging.txt
          "$BT/aapt" dump permissions candidate/Miqaat-play.apk > candidate/play-permissions.txt
          "$BT/aapt" dump xmltree candidate/Miqaat-play.apk AndroidManifest.xml > candidate/play-manifest.txt
          ! grep -q REQUEST_INSTALL_PACKAGES candidate/play-permissions.txt
          grep -q USE_EXACT_ALARM candidate/play-permissions.txt
          grep -q "targetSdkVersion:'36'" candidate/play-badging.txt
          jarsigner -verify -verbose -certs candidate/Miqaat-play.aab > candidate/aab-signature.txt
          grep -q 'jar verified' candidate/aab-signature.txt
          sha256sum candidate/Miqaat.apk candidate/Miqaat-play.apk candidate/Miqaat-play.aab > candidate/SHA256SUMS
          printf 'run=%s\ncommit=%s\nTesting candidate only; verify versionCode against Play Console before upload. No publish or promotion.\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > candidate/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-candidate-${{ github.run_id }}
          path: |
            candidate/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A tablet's natural orientation is landscape, a phone's is portrait; rotation 1 flips either. Each device is split
        # into four groups of tests so the matrix finishes inside the time box.
        include:
          - { name: tablet-landscape, group: a, profile: pixel_tablet, rotation: 0, tests: 'homes,homesUrdu,states' }
          - { name: tablet-landscape, group: b, profile: pixel_tablet, rotation: 0, tests: 'settingsLanding,settingsCategories' }
          - { name: tablet-landscape, group: c, profile: pixel_tablet, rotation: 0, tests: 'secondaryPages' }
          - { name: tablet-portrait, group: a, profile: pixel_tablet, rotation: 1, tests: 'homes,homesUrdu,states' }
          - { name: tablet-portrait, group: b, profile: pixel_tablet, rotation: 1, tests: 'settingsLanding,settingsCategories' }
          - { name: tablet-portrait, group: c, profile: pixel_tablet, rotation: 1, tests: 'secondaryPages' }
          - { name: phone-portrait, group: a, profile: pixel_6, rotation: 0, tests: 'homes,homesUrdu,states' }
          - { name: phone-portrait, group: b, profile: pixel_6, rotation: 0, tests: 'settingsLanding,settingsCategories' }
          - { name: phone-portrait, group: c, profile: pixel_6, rotation: 0, tests: 'secondaryPages' }
          - { name: phone-landscape, group: a, profile: pixel_6, rotation: 1, tests: 'homes,homesUrdu,states' }
          - { name: phone-landscape, group: b, profile: pixel_6, rotation: 1, tests: 'settingsLanding,settingsCategories' }
          - { name: phone-landscape, group: c, profile: pixel_6, rotation: 1, tests: 'secondaryPages' }
          - { name: tablet-landscape, group: d, profile: pixel_tablet, rotation: 0, tests: 'azaanFlow,learnLessons' }
          - { name: tablet-portrait, group: d, profile: pixel_tablet, rotation: 1, tests: 'azaanFlow,learnLessons' }
          - { name: phone-portrait, group: d, profile: pixel_6, rotation: 0, tests: 'azaanFlow,learnLessons' }
          - { name: phone-landscape, group: d, profile: pixel_6, rotation: 1, tests: 'azaanFlow,learnLessons' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh Android 16 target-device acceptance evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/emulator-run.sh ${{ matrix.rotation }} ${{ matrix.name }}-${{ matrix.group }} ${{ matrix.tests }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android36-${{ matrix.name }}-${{ matrix.group }}-${{ github.run_id }}
          path: shots/
          if-no-files-found: error
