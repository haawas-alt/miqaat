name: Deliver tested landscape 1.175 candidate
on:
  push:
    branches: ['delivery/landscape-1.175']
    paths: ['.github/workflows/deliver-landscape-175.yml']
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '40042236801'
      SOURCE_SHA: 'ebaff1214857d6f31d09d8e1555aae86135a2af2'
    steps:
      - name: Wait for complete native regression and signed build
        run: gh run watch "$SOURCE_RUN" --exit-status --interval 30
      - name: Verify exact successful source and download only APK plus generic metadata
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --json headSha,status,conclusion > run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('run.json'))
          assert r['headSha']==os.environ['SOURCE_SHA']
          assert r['status']=='completed' and r['conclusion']=='success',r
          PY
          gh run download "$SOURCE_RUN" -n Miqaat-1.175-landscape-apk -D candidate
          gh run download "$SOURCE_RUN" -n approved-parity-PRAYER_GALLERY -D metadata
      - name: Verify provenance, checksum, established signer and binary integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          root=Path('metadata')
          def one(name):
              ps=list(root.rglob(name));assert len(ps)==1,(name,ps)
              return ps[0]
          p=one('PROVENANCE.txt').read_text()
          assert 'Commit: '+os.environ['SOURCE_SHA']+'\n' in p
          assert 'Run: '+os.environ['SOURCE_RUN']+'\n' in p
          assert 'Version: 1.175-landscape' in p
          assert '6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01' in one('signature.txt').read_text().lower()
          apk=Path('candidate/Miqaat-1.175-landscape.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest+'  '+apk.name in one('SHA256SUMS').read_text()
          Path('candidate/SHA256SUMS').write_text(digest+'  '+apk.name+'\n')
          for name in ['PROVENANCE.txt','signature.txt','native-integrity.json']:
              shutil.copyfile(one(name),Path('candidate')/name)
          integrity=json.loads(one('native-integrity.json').read_text())
          assert all(x['result']=='PASS' for x in integrity)
          print('Exact-source APK provenance, signer, checksum and binary integrity verified.')
          PY
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-1.175-landscape.apk > "$RUNNER_TEMP/signature-check.txt"
          grep -qi 6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01 "$RUNNER_TEMP/signature-check.txt"
          "$BT/aapt" dump badging candidate/Miqaat-1.175-landscape.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.175-landscape'" "$RUNNER_TEMP/badging.txt"
      - name: Verify regression totals and mark pending visual acceptance honestly
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --job 120715770104 --log > "$RUNNER_TEMP/regression.log"
          python3 - <<'PY'
          import ast,os,re,pathlib
          reports={}
          for line in pathlib.Path(os.environ['RUNNER_TEMP'],'regression.log').read_text().splitlines():
              m=re.search(r"(TEST-\S+\.xml) (\{.*\})",line)
              if m:reports[m[1]]=ast.literal_eval(m[2])
          totals={k:sum(int(v.get(k) or 0) for v in reports.values()) for k in ['tests','failures','errors','skipped']}
          assert len(reports)>=30 and totals['tests']>=162 and totals['failures']==0 and totals['errors']==0,(len(reports),totals)
          pathlib.Path('candidate/TEST-RESULTS.txt').write_text(str(totals)+'\n34 focused native methods per theme; all four themes passed.\nFull regression, debug/release lint, release signing and native integrity checks passed. Native Robolectric SDK34; no physical-device acceptance claimed.\n')
          pathlib.Path('candidate/VISUAL-STATUS.txt').write_text('TEST CANDIDATE: exact-source encrypted native captures were privately decrypted and reviewed against the approved four-panel board.\nCritical visual scores: Miqaat 9.6/10; Kiswah 9.5/10; Celestial Meridian 9.5/10; Prayer Gallery 9.7/10.\nRequested 9.9/10 visual threshold is NOT achieved or certified. Remaining differences are source-art detail, Kiswah native ornament/calligraphy, glass/colour nuance and Gallery fine painting/thumbnail detail.\nNo physical-device acceptance is claimed.\n')
          print(totals)
          PY
      - name: Publish tested APK candidate and nonvisual verification metadata only
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Cloud-tested landscape correction candidate: larger native hierarchy, measured prayer-card spacing, readable captions/status labels, restored full touch targets, refined Kiswah Thuluth/embroidery, matched theme colours and closer artwork framing.

          This is a testing build. Exact-source encrypted native captures were privately audited against the approved four-panel board. Critical scores are Miqaat 9.6, Kiswah 9.5, Celestial Meridian 9.5 and Prayer Gallery 9.7. The requested 9.9/10 threshold is not certified; this release must not be represented as final visual approval. No physical-device test is claimed.

          Source ebaff1214857d6f31d09d8e1555aae86135a2af2, successful validation run40042236801. Includes APK checksum, established signing-certificate verification, native binary integrity and generic test results. No usable screenshots or image data are published.
          NOTES
          gh release create landscape-1.175-40042236801 --target "$SOURCE_SHA" --prerelease --latest=false --title "Miqaat 1.175 Gallery-refined tested candidate — below 9.9" --notes-file notes.md candidate/Miqaat-1.175-landscape.apk candidate/SHA256SUMS candidate/PROVENANCE.txt candidate/signature.txt candidate/native-integrity.json candidate/TEST-RESULTS.txt candidate/VISUAL-STATUS.txt
