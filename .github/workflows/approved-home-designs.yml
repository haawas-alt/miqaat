name: Approved Home design verification
on:
  push:
    branches: ['feat/approved-home-designs']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-home-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        theme: [MIQAAT, KISWAH, CELESTIAL_MERIDIAN, PRAYER_GALLERY]
    env:
      MIQAAT_VISUAL_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Native Home geometry, text and action assertions
        run: ./gradlew --no-daemon testGithubDebugUnitTest --tests '*ApprovedHomeAcceptanceTest'
      - name: Retained regression suite, lint and test APK
        if: matrix.theme == 'PRAYER_GALLERY'
        run: ./gradlew --no-daemon testGithubDebugUnitTest --tests '*GalleryStatusBadgeTest' --tests '*DetailedGalleryAcceptanceTest' --tests '*GalleryDoorPriorityTest' --tests '*PrayerEngineTest' --tests '*LearnSequenceTest' lintGithubDebug assembleGithubDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-home-${{ matrix.theme }}
          retention-days: 30
          path: |
            app/build/approved-designs/
            app/build/audit-screens/
            app/build/test-results/
            app/build/reports/
            app/build/outputs/apk/github/debug/
