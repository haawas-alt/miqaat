name: Landscape mockup parity and device regression
on:
  push:
    branches: ['feat/landscape-mockup-parity']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landscape-parity-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin read-only source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        theme: [MIQAAT, KISWAH, CELESTIAL_MERIDIAN, PRAYER_GALLERY]
    env:
      MIQAAT_VISUAL_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure pinned native toolchain with download retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'; then break; fi
            [ "$attempt" -lt 3 ] || exit 1
          done
          test -f "$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
      - name: Native mockup geometry, actions and retained portrait/tablet acceptance
        run: GITHUB_SHA=$(git rev-parse HEAD) ./gradlew --no-daemon testGithubDebugUnitTest --tests '*LandscapeMockupParityTest' --tests '*DetailedGalleryAcceptanceTest' --tests '*ApprovedPhoneRefinementAcceptanceTest' --tests '*ThemeSelectionTest' --tests '*ApprovedPhoneLandscapeAcceptanceTest' --tests '*ApprovedHomeAcceptanceTest' --tests '*ApprovedQuietAcceptanceTest' --tests '*ApprovedIqamahAcceptanceTest' --tests '*IqamahCounterTest'
      # Public artifacts contain ciphertext only. The reviewer private key is never
      # placed in source, runner environment, logs or uploaded artifacts.
      - name: Encrypt captures for private visual audit
        if: always()
        run: python3 tools/seal_landscape_review.py app/build tools/landscape-review-public.pem sealed/private-render-${{ matrix.theme }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-render-${{ matrix.theme }}
          path: sealed/*.zip
          retention-days: 7
      - name: Retained regression suite, lint and test APK
        if: matrix.theme == 'PRAYER_GALLERY'
        run: GITHUB_SHA=$(git rev-parse HEAD) ./gradlew --no-daemon testGithubDebugUnitTest lintGithubDebug assembleGithubDebug
      - name: Restore established signing key and candidate identity
        if: matrix.theme == 'PRAYER_GALLERY'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks
          echo "MIQAAT_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "MIQAAT_VERSION_NAME=1.175-landscape" >> "$GITHUB_ENV"
          echo "MIQAAT_BUILD_TAG=approved-parity-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Build and verify signed design candidate
        if: matrix.theme == 'PRAYER_GALLERY'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          GITHUB_SHA=$(git rev-parse HEAD) ./gradlew --no-daemon assembleGithubRelease assemblePlayRelease bundlePlayRelease lintPlayRelease
          mkdir -p candidate
          cp app/build/outputs/apk/github/release/app-github-release.apk candidate/Miqaat-1.175-landscape.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk candidate/Miqaat-1.175-play.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab candidate/Miqaat-1.175-play.aab
          python3 tools/check_release_integrity.py candidate/Miqaat-1.175-landscape.apk > candidate/native-integrity.json
          python3 tools/check_forbidden_assets.py app/src/main candidate/Miqaat-1.175-landscape.apk candidate/Miqaat-1.175-play.apk candidate/Miqaat-1.175-play.aab
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-1.175-landscape.apk > candidate/signature.txt
          grep -qi 6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01 candidate/signature.txt
          "$BT/aapt" dump permissions candidate/Miqaat-1.175-play.apk > candidate/play-permissions.txt
          ! grep -q REQUEST_INSTALL_PACKAGES candidate/play-permissions.txt
          (cd candidate && sha256sum *.apk *.aab > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nVersion: %s\nNative Robolectric SDK34 verification. Candidate only; no physical-device acceptance claimed.\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$MIQAAT_VERSION_NAME" > candidate/PROVENANCE.txt
      - name: Print exact assertion failures and test totals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for p in Path('app/build/test-results').rglob('TEST-*.xml'):
            r=E.parse(p).getroot()
            print(p.name, {k:r.get(k) for k in ['tests','failures','errors','skipped']})
            for t in r.findall('testcase'):
              for f in t.findall('failure'): print(t.get('name'), f.get('message'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-parity-${{ matrix.theme }}
          retention-days: 30
          path: |
            candidate/*.txt
            candidate/*.json
            candidate/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success() && matrix.theme == 'PRAYER_GALLERY'
        with:
          name: Miqaat-1.175-landscape-apk
          path: candidate/Miqaat-1.175-landscape.apk
      - uses: actions/upload-artifact@v4
        if: success() && matrix.theme == 'PRAYER_GALLERY'
        with:
          name: Miqaat-1.175-play-artifacts
          path: |
            candidate/Miqaat-1.175-play.apk
            candidate/Miqaat-1.175-play.aab
