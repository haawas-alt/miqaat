name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Miqaat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Miqaat-apk
          path: Miqaat.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Miqaat (latest build)
          body: "Download Miqaat.apk on the tablet and open it to install. Build ${{ github.run_number }} from ${{ github.sha }}."
          files: Miqaat.apk
          prerelease: false
