name: Approved Iqamah design verification
on:
  push:
    branches: ['feat/approved-iqamah-designs']
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-iqamah-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        theme: [MIQAAT, KISWAH, CELESTIAL_MERIDIAN, PRAYER_GALLERY]
    env:
      MIQAAT_VISUAL_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Native Iqamah geometry, text and action assertions
        run: ./gradlew --no-daemon testGithubDebugUnitTest --tests '*ApprovedIqamahAcceptanceTest' --tests '*IqamahCounterTest'
      - name: Retained regression suite, lint and test APK
        if: matrix.theme == 'PRAYER_GALLERY'
        run: ./gradlew --no-daemon testGithubDebugUnitTest lintGithubDebug assembleGithubDebug
      - name: Restore established signing key and candidate identity
        if: matrix.theme == 'PRAYER_GALLERY'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks
          echo "MIQAAT_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "MIQAAT_VERSION_NAME=1.167-iqamah" >> "$GITHUB_ENV"
          echo "MIQAAT_BUILD_TAG=approved-iqamah-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Build and verify signed design candidate
        if: matrix.theme == 'PRAYER_GALLERY'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleGithubRelease assemblePlayRelease bundlePlayRelease lintPlayRelease
          mkdir -p candidate
          cp app/build/outputs/apk/github/release/app-github-release.apk candidate/Miqaat-1.167-iqamah.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk candidate/Miqaat-1.167-play.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab candidate/Miqaat-1.167-play.aab
          python3 tools/check_release_integrity.py candidate/Miqaat-1.167-iqamah.apk > candidate/native-integrity.json
          python3 tools/check_forbidden_assets.py app/src/main candidate/Miqaat-1.167-iqamah.apk candidate/Miqaat-1.167-play.apk candidate/Miqaat-1.167-play.aab
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-1.167-iqamah.apk > candidate/signature.txt
          grep -qi 6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01 candidate/signature.txt
          "$BT/aapt" dump permissions candidate/Miqaat-1.167-play.apk > candidate/play-permissions.txt
          ! grep -q REQUEST_INSTALL_PACKAGES candidate/play-permissions.txt
          (cd candidate && sha256sum *.apk *.aab > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nVersion: %s\nNative Robolectric SDK34 verification. Candidate only; no physical-device acceptance claimed.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$MIQAAT_VERSION_NAME" > candidate/PROVENANCE.txt
      - name: Print exact assertion failures and test totals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for p in Path('app/build/test-results').rglob('TEST-*.xml'):
            r=E.parse(p).getroot()
            print(p.name, {k:r.get(k) for k in ['tests','failures','errors','skipped']})
            for t in r.findall('testcase'):
              for f in t.findall('failure'): print(t.get('name'), f.get('message'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-iqamah-${{ matrix.theme }}
          retention-days: 30
          path: |
            app/build/iqamah-designs/
            app/build/test-results/
            app/build/reports/
            candidate/*.txt
            candidate/*.json
            candidate/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success() && matrix.theme == 'PRAYER_GALLERY'
        with:
          name: Miqaat-1.167-iqamah-apk
          path: candidate/Miqaat-1.167-iqamah.apk
      - uses: actions/upload-artifact@v4
        if: success() && matrix.theme == 'PRAYER_GALLERY'
        with:
          name: Miqaat-1.167-play-artifacts
          path: |
            candidate/Miqaat-1.167-play.apk
            candidate/Miqaat-1.167-play.aab
