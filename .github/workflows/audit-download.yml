name: Publish checked signed APK test download
on:
  push:
    branches: ['fix/run158-audit-remediation']
    paths: ['.github/workflows/audit-download.yml']
permissions:
  contents: write
  actions: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation for the exact candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          source = "3e6ae9236f0b9425b757d55f23109b3b5b6ea85e"
          for run in (37109187582, 37109187387):
              data = json.loads(subprocess.check_output(["gh", "api", f"repos/haawas-alt/miqaat/actions/runs/{run}"]))
              assert data["head_sha"] == source and data["conclusion"] == "success", f"Validation gate not met: {run}"
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37109187582
          name: signed-candidate-37109187582
          path: validated
      - name: Verify exact signed candidate and layout/counter regressions
        run: |
          set -euo pipefail
          cd validated
          sha256sum -c candidate/SHA256SUMS
          grep -q 'commit=3e6ae9236f0b9425b757d55f23109b3b5b6ea85e' candidate/PROVENANCE.txt
          grep -q '6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01' candidate/github-signature.txt
          echo '06eecd91e988918a47bb768eaa8ed53e649f9a504191594edd3f779fd19b5b96  candidate/Miqaat.apk' | sha256sum -c -
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, json
          files = list(pathlib.Path(".").rglob("TEST-com.usman.miqaat.ui.SettingsBackAcceptanceTest.xml"))
          assert files, "Missing corrected Settings regression evidence"
          for path in files:
              root = ET.parse(path).getroot()
              assert root.get("tests") == "2"
              assert all(root.get(k, "0") == "0" for k in ("failures", "errors", "skipped"))
          for suite, count in (("ApprovedSalahRebuildTest", "3"), ("DailyDhikrProgressTest", "3"), ("DetailedGalleryAcceptanceTest", "1")):
              suites = [p for p in pathlib.Path(".").rglob("TEST-*.xml") if p.name.endswith("." + suite + ".xml")]
              assert suites, f"Missing {suite} evidence"
              for path in suites:
                  root = ET.parse(path).getroot()
                  assert root.get("tests") == count
                  assert all(root.get(k, "0") == "0" for k in ("failures", "errors", "skipped"))
          reports = json.loads(pathlib.Path("candidate/native-page-alignment.json").read_text())
          assert len(reports) == 2 and all(r["result"] == "PASS" for r in reports)
          PY
          cp candidate/Miqaat.apk ../Miqaat-1.86-detail.apk
          cp candidate/Miqaat-play.aab ../Miqaat-1.86-detail-play.aab
          cp candidate/PROVENANCE.txt ../Miqaat-1.86-detail-PROVENANCE.txt
          cd ..
          sha256sum Miqaat-1.86-detail.apk > Miqaat-1.86-detail.apk.sha256
          sha256sum Miqaat-1.86-detail-play.aab > Miqaat-1.86-detail-play.aab.sha256
          cat >> Miqaat-1.86-detail-PROVENANCE.txt <<'TXT'
          Native runtime: source68ef915cf155f5bde7c4a2f82f107d107a292ff1; run36982213209; two native tests pass on API33/4KB and API35/16KB. Overall run failed other assertions.
          Raw phone evidence: sourceb4737afab4b928a3509e79a635e5e5fbb1cb8232; run36984122910; all216 captures pass strict inventory; overall run failed a case-sensitive Settings heading assertion.
          That assertion is corrected and the complete back/scroll contract passes both native JVM phone layouts; final Android assertion correction was compiled, not rerun.
          Detailed original Salah artwork, mat alignment, landscape posture panels and compact Gallery Home: source3e6ae9236f0b9425b757d55f23109b3b5b6ea85e; audit37109187387 and signed37109187582. Native JVM rendered evidence; no fresh physical-device or emulator acceptance claimed.
          The complete earlier approved ZIP remains unretrieved. Qualified Urdu/Islamic approval of the new artwork, physical accessibility/OEM acceptance and Play Console approval remain pending.
          This existing testing release tag predates the candidate source; use this provenance and asset hashes, not the tag commit, to identify the build.
          TXT
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37109187387
          name: audit-fix-validation-37109187387
          path: validated-ui
      - name: Package raw Gallery posture and Home review evidence
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, json
          import struct
          root = pathlib.Path("validated-ui/audit-screens")
          all_images = sorted(root.rglob("*.png"))
          assert len(all_images) == 640, f"Incomplete final capture set: {len(all_images)}"
          themes = ("miqaat", "kiswah", "celestial_meridian", "prayer_gallery")
          devs = ("phone-portrait", "phone-landscape", "tablet-portrait", "tablet-landscape")
          poses = ("takbir", "standing", "bowing", "rising", "prostrating", "sitting", "tashahhud", "salam")
          for theme in themes:
              for dev in devs:
                  for pose in poses:
                      for state in ("top", "cue"):
                          assert (root / "approved-salah" / f"posture__{pose}__{theme}__{dev}__100__{state}.png").exists()
          gallery = sorted(root.glob("approved-salah/posture__*__prayer_gallery__*__100__top.png"))
          home = sorted(root.glob("detailed-gallery/home__*.png"))
          assert len(gallery) == 32 and len(home) == 8
          records = []
          with zipfile.ZipFile("Miqaat-1.86-detail-review.zip", "w", zipfile.ZIP_DEFLATED) as out:
              for path in gallery + home:
                  name = path.relative_to(root).as_posix()
                  size = list(struct.unpack(">II", path.read_bytes()[16:24]))
                  records.append({"path": name, "dimensions": size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
                  out.write(path, name)
              out.writestr("PROVENANCE.json", json.dumps({"source": "3e6ae9236f0b9425b757d55f23109b3b5b6ea85e", "audit_run": 37109187387, "scope": "32 raw Gallery posture captures across all four targets plus eight EN/UR mobile Home states; full 640 captures remain in Actions", "images": records}, indent=2))
          PY
          sha256sum Miqaat-1.86-detail-review.zip > Miqaat-1.86-detail-review.zip.sha256
      - name: Attach exact artifacts to existing testing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload audit-fixes-3895c823 Miqaat-1.86-detail.apk Miqaat-1.86-detail.apk.sha256 Miqaat-1.86-detail-play.aab Miqaat-1.86-detail-play.aab.sha256 Miqaat-1.86-detail-PROVENANCE.txt Miqaat-1.86-detail-review.zip Miqaat-1.86-detail-review.zip.sha256 --repo haawas-alt/miqaat --clobber
