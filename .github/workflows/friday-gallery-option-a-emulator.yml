name: Friday Gallery Option A emulator captures

on:
  push:
    branches: ['recovery/friday-gallery-option-a-20261117']
    paths:
      - 'app/src/androidTest/java/com/usman/miqaat/ui/PrayerGalleryOptionAEmulatorTest.kt'
      - '.github/workflows/friday-gallery-option-a-emulator.yml'
      - 'app/src/main/java/com/usman/miqaat/ui/PrayerGalleryFridayOptionA.kt'
      - 'app/src/main/res/drawable-nodpi/prayer_gallery_friday_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: phone-portrait, profile: pixel_6, rotation: 0, orientation: portrait}
          - {name: phone-landscape, profile: pixel_6, rotation: 1, orientation: landscape}
          - {name: tablet-portrait, profile: pixel_tablet, rotation: 1, orientation: portrait}
          - {name: tablet-landscape, profile: pixel_tablet, rotation: 0, orientation: landscape}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Friday and weekday on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation ${{ matrix.rotation }}
            adb shell wm user-rotation lock ${{ matrix.rotation }}
            mkdir -p shots
            ./gradlew --no-daemon -Pandroid.testInstrumentationRunnerArguments.orientation=${{ matrix.orientation }} -Pandroid.testInstrumentationRunnerArguments.class=com.usman.miqaat.ui.PrayerGalleryOptionAEmulatorTest connectedGithubDebugAndroidTest
            adb pull /sdcard/Pictures/MiqaatOptionA/ shots/screens/
      - name: Publish emulator screenshots for visual audit
        if: success()
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p /tmp/option-a-emulator-shots
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = list(Path('shots/screens').rglob('option-a-*.png'))
          if len(source) != 4:
              raise SystemExit(f'Expected four Friday/weekday English/Urdu captures, found {len(source)}')
          for path in source:
              with Image.open(path) as image:
                  image.convert('RGB').save(Path('/tmp/option-a-emulator-shots') / path.with_suffix('.jpg').name,
                                            quality=88, optimize=True)
          PY
          cd /tmp/option-a-emulator-shots
          git init -q
          git checkout -q -b "ci-option-a-emulator-${GITHUB_SHA:0:12}-${{ matrix.name }}"
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "Option A emulator screenshots ${GITHUB_SHA:0:12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-a-emulator-${{ matrix.name }}-${{ github.run_id }}
          path: |
            shots/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
