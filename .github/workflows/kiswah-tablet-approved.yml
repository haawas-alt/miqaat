name: Approved Kiswah tablet candidate
on:
  push:
    branches: ['feat/kiswah-tablet-approved']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kiswah-tablet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIQAAT_VISUAL_THEME: KISWAH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Native board geometry, text fit and controls
        run: ./gradlew --no-daemon testGithubDebugUnitTest --tests '*KiswahTabletAcceptanceTest' --tests '*ApprovedHomeAcceptanceTest.tabletPortrait' --tests '*ApprovedHomeAcceptanceTest.tabletLandscape'
      - name: Encrypt review captures
        if: always()
        run: python3 tools/seal_landscape_review.py app/build tools/tablet-review-public.pem sealed/kiswah-tablets.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kiswah-tablet-renders, path: 'sealed/*.zip', retention-days: 14}
      - name: Print assertion results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for p in Path('app/build/test-results').rglob('TEST-*.xml'):
            r=E.parse(p).getroot()
            print(p.name, {k:r.get(k) for k in ['tests','failures','errors','skipped']})
            for t in r.findall('testcase'):
              for f in t.findall('failure'): print(t.get('name'),f.get('message'))
          PY
  protection:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Render production baseline
        run: |
          set -euo pipefail
          trap 'git restore --source=HEAD --worktree app/src/main' EXIT
          git restore --source=5e910d586c19e0ca55c99f4ce724a363f6180cda --worktree app/src/main
          ./gradlew --no-daemon testGithubDebugUnitTest --tests '*RetainedHome181Test' --tests '*ApprovedPhoneLandscapeAcceptanceTest' --tests '*Tablet181ReviewTest'
          mkdir -p app/build/kiswah-protected-before
          cp -a app/build/protected-home app/build/phone-landscape app/build/tablet-polish app/build/kiswah-protected-before/
          git restore --source=HEAD --worktree app/src/main
          trap - EXIT
      - name: Render candidate protected screens and compare pixels
        run: |
          ./gradlew --no-daemon testGithubDebugUnitTest --tests '*RetainedHome181Test' --tests '*ApprovedPhoneLandscapeAcceptanceTest' --tests '*Tablet181ReviewTest'
          mkdir -p app/build/kiswah-protected-after
          cp -a app/build/protected-home app/build/phone-landscape app/build/tablet-polish app/build/kiswah-protected-after/
          python3 -m pip install Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          for root in ['app/build/kiswah-protected-before','app/build/kiswah-protected-after']:
            for p in (Path(root)/'protected-home/KISWAH').glob('tablet-*'):
              p.unlink()
          PY
          python3 tools/verify_landscape_unchanged.py app/build/kiswah-protected-before app/build/kiswah-protected-after protected-pixels.json 5e910d586c19e0ca55c99f4ce724a363f6180cda
      - uses: actions/upload-artifact@v4
        with: {name: protected-screen-comparison, path: protected-pixels.json}
  candidate:
    needs: [render, protection]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing app signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks
          echo "MIQAAT_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "MIQAAT_VERSION_NAME=1.183-kiswah-tablet" >> "$GITHUB_ENV"
          echo "MIQAAT_BUILD_TAG=kiswah-tablet-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Full regression, lint and signed packages
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon testGithubReleaseUnitTest lintGithubRelease assembleGithubRelease assemblePlayRelease bundlePlayRelease
          python3 tools/check_forbidden_assets.py app/src/main app/build/outputs/apk/github/release/app-github-release.apk app/build/outputs/apk/play/release/app-play-release.apk app/build/outputs/bundle/playRelease/app-play-release.aab
          mkdir -p candidate
          cp app/build/outputs/apk/github/release/app-github-release.apk candidate/Miqaat-Kiswah-Tablet.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab candidate/Miqaat-Kiswah-Tablet.aab
          python3 tools/check_release_integrity.py candidate/Miqaat-Kiswah-Tablet.apk > candidate/native-integrity.json
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-Kiswah-Tablet.apk > candidate/signature.txt
          grep -qi 6285b269623127c3e2f0e87a5967f3fe143414c97371de3284d3489984541b01 candidate/signature.txt
          (cd candidate && sha256sum *.apk *.aab > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with: {name: signed-kiswah-tablet-candidate, path: 'candidate/*'}
      - name: Publish installable testing candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "kiswah-tablet-${GITHUB_SHA:0:12}" candidate/* --target "$GITHUB_SHA" --prerelease --title "Kiswah tablet portrait and landscape candidate" --notes "Owner-approved Kiswah tablet boards. Signed with the existing app key. Candidate only; production updater unchanged. Source: $GITHUB_SHA"
