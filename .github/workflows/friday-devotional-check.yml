name: Friday devotional pilot check
on:
  push:
    branches: ['feat/friday-approved-devotional-20261125']
    paths:
      - '.github/workflows/friday-devotional-check.yml'
      - 'app/src/main/java/com/usman/miqaat/MainActivity.kt'
      - 'app/src/main/java/com/usman/miqaat/ui/FridayDevotional*'
      - 'app/src/main/java/com/usman/miqaat/ui/HomeRouter.kt'
      - 'app/src/main/res/drawable-nodpi/friday_devotional_*'
      - 'app/src/test/java/com/usman/miqaat/ui/FridayDevotional*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and test rotation
        run: |
          ./gradlew --no-daemon testGithubDebugUnitTest --tests 'com.usman.miqaat.ui.FridayDevotionalCycleTest.*' assembleGithubDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friday-devotional-pilot-${{ github.run_id }}
          path: |
            app/build/test-results/testGithubDebugUnitTest/
            app/build/reports/tests/testGithubDebugUnitTest/
            app/build/outputs/apk/github/debug/
          if-no-files-found: warn
