name: Friday Gallery signed test APK
on:
  push:
    branches: ['recovery/friday-gallery-option-a-20261117']
    paths: ['.github/workflows/friday-gallery-signed-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/miqaat.jks
          echo "MIQAAT_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "MIQAAT_VERSION_NAME=1.193-friday-option-a-test" >> "$GITHUB_ENV"
          echo "MIQAAT_BUILD_TAG=option-a-test-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleGithubRelease
          mkdir -p candidate
          cp app/build/outputs/apk/github/release/app-github-release.apk candidate/Miqaat-Friday-Gallery-Option-A.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs candidate/Miqaat-Friday-Gallery-Option-A.apk > candidate/signature.txt
          sha256sum candidate/Miqaat-Friday-Gallery-Option-A.apk > candidate/SHA256SUMS
          printf 'run=%s\ncommit=%s\nSigned test APK only; no release or promotion.\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > candidate/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Friday-Gallery-Option-A-signed-test-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
