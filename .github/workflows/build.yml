name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: set -o pipefail; ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Caused by" build.log | sed 's#file:///home/runner/work/miqaat/miqaat/##' | head -200 > errors.txt || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . || true
          mkdir -p /tmp/keep && cp errors.txt build.log /tmp/keep/
          git clean -fdxq || true
          cp /tmp/keep/* .
          git add errors.txt build.log
          git commit -qm "build log ${{ github.run_number }}" || true
          git push -f origin ci-logs

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Miqaat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Miqaat-apk
          path: Miqaat.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Miqaat (latest build)
          body: "Download Miqaat.apk on the tablet and open it to install. Build ${{ github.run_number }} from ${{ github.sha }}."
          files: Miqaat.apk
          prerelease: false
